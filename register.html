<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration | Online Payroll System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section style="
        max-width:450px;
        margin:40px auto;
        padding:25px;
        background:white;
        border-radius:12px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
    ">

        <h2 style="text-align:center;">Register Your Company</h2>
        <p style="text-align:center;">
            Create your company payroll account.
        </p>

        <form id="companyRegistrationForm">

            <label>Company Name</label>
            <input type="text" id="companyName"
                placeholder="Enter company name" required>

            <label>Owner's Name</label>
            <input type="text" id="ownerName"
                placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="companyEmail"
                placeholder="Enter email address" required>

            <label>Phone Number</label>
            <input type="tel" id="companyPhone"
                placeholder="Enter phone number">

            <label>Password</label>
            <input type="password" id="companyPassword"
                placeholder="Create password" required minlength="8">

            <button type="submit">Register Company</button>

        </form>

        <p id="registrationMessage"></p>

        <p style="text-align:center;">
            Already registered?
            <a href="index.html">Login here</a>
        </p>

    </section>

    <script type="module" src="register.js"></script>

</body>
</html>
